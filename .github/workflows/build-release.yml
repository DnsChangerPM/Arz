name: Build and release
on:
  workflow_dispatch:
    inputs:
      APP_VERSION:
        description: Application semantic version (for example 1.2.0)
        required: true
        type: string
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}-${{ inputs.APP_VERSION }}
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - id: v
        shell: bash
        env: { INPUT_VERSION: '${{ inputs.APP_VERSION }}' }
        run: |
          V="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && V="$INPUT_VERSION"
          [[ "$V" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'Invalid SemVer'; exit 1; }
          IFS=. read -r MA MI PA <<< "$V"
          CODE=$((MA*1000000 + MI*1000 + PA))
          [ "$CODE" -gt 0 ] && [ "$CODE" -le 2100000000 ] || exit 1
          echo "version=$V" >> "$GITHUB_OUTPUT"; echo "code=$CODE" >> "$GITHUB_OUTPUT"
  quality:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.35.4', channel: stable, cache: true }
      - run: flutter --version && flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze --fatal-infos
      - run: flutter test --coverage
  android:
    needs: [version, quality]
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.35.4', channel: stable, cache: true }
      - run: flutter pub get
      - name: Configure signing
        id: signing
        shell: bash
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          MISSING=
          for NAME in KEYSTORE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!NAME}" ] || MISSING="$MISSING $NAME"
          done
          if [ -n "$MISSING" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Release keystore not configured::Missing secrets:$MISSING. The APK will be signed with the Android debug key, which is fine for testing but must not be published to users. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD to sign properly."
            echo '> [!WARNING]' >> "$GITHUB_STEP_SUMMARY"
            echo '> Android APK is **debug-signed**: repository signing secrets are not configured.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf '%s' "$KEYSTORE" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/release.jks"
          [ -s "$RUNNER_TEMP/release.jks" ] || { echo '::error title=Invalid keystore::ANDROID_KEYSTORE_BASE64 did not decode to a keystore file.'; exit 1; }
          esc() { printf '%s' "$1" | sed 's/\\/\\\\/g'; }  # backslash is an escape in .properties values
          printf '%s\n' \
            "storeFile=$(esc "$RUNNER_TEMP/release.jks")" \
            "storePassword=$(esc "$STORE_PASSWORD")" \
            "keyAlias=$(esc "$KEY_ALIAS")" \
            "keyPassword=$(esc "$KEY_PASSWORD")" > android/key.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo 'Android APK will be signed with the configured release keystore.' >> "$GITHUB_STEP_SUMMARY"
      - run: flutter build apk --release --build-name '${{ needs.version.outputs.version }}' --build-number '${{ needs.version.outputs.code }}'
      - run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          cp build/app/outputs/flutter-apk/app-release.apk TomanRates-${{ needs.version.outputs.version }}-Android.apk
          sha256sum TomanRates-*.apk > TomanRates-${{ needs.version.outputs.version }}-Android.sha256
      - uses: actions/upload-artifact@v4
        with: { name: android-release, path: 'TomanRates-*' }
  windows:
    needs: [version, quality]
    # Pinned on purpose: windows-latest/windows-2025 ship Visual Studio 2026 (v18),
    # which Flutter 3.35.x cannot detect. It then falls back to the
    # "Visual Studio 16 2019" CMake generator and the build dies with
    # "could not find any instance of Visual Studio". windows-2022 has VS 2022 (v17).
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.35.4', channel: stable, cache: true }
      - name: Verify Visual Studio C++ toolchain
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (!(Test-Path $vswhere)) { throw 'vswhere.exe not found: no Visual Studio installation on this runner.' }
          $installs = & $vswhere -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -format json | ConvertFrom-Json
          if (!$installs) { throw 'No Visual Studio install with the C++ desktop toolchain (VC.Tools.x86.x64) was found.' }
          $installs | ForEach-Object { "Found $($_.displayName) $($_.installationVersion)" }
          $major = [int]($installs[0].installationVersion.Split('.')[0])
          if ($major -ne 17) {
            throw "Flutter 3.35.4 only supports Visual Studio 2022 (v17); this runner has v$major. Pin runs-on to an image with VS 2022 or upgrade Flutter."
          }
      - run: flutter config --enable-windows-desktop; flutter pub get
      - run: flutter doctor -v
      - run: flutter build windows --release --build-name '${{ needs.version.outputs.version }}' --build-number '${{ needs.version.outputs.code }}'
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc "/DAppVersion=${{ needs.version.outputs.version }}" installer/toman_rates.iss
          $file="build/installer/TomanRates-${{ needs.version.outputs.version }}-Windows.exe"
          if (!(Test-Path $file) -or (Get-Item $file).Length -eq 0) { throw 'Installer missing' }
          (Get-FileHash $file -Algorithm SHA256).Hash + "  " + (Split-Path $file -Leaf) | Set-Content "TomanRates-${{ needs.version.outputs.version }}-Windows.sha256"
          Copy-Item $file .
      - uses: actions/upload-artifact@v4
        with: { name: windows-release, path: 'TomanRates-*' }
  release:
    needs: [version, android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - name: Create tag for manual release
        if: github.event_name == 'workflow_dispatch'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          TAG=v${{ needs.version.outputs.version }}
          git rev-parse "$TAG" >/dev/null 2>&1 && { echo "Tag exists"; exit 1; }
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: '${{ github.token }}'
          SIGNED: '${{ needs.android.outputs.signed }}'
        run: |
          TAG=v${{ needs.version.outputs.version }}
          NOTES='Android 7.0+ (API 24) and Windows 10/11 x64. Verify the attached SHA-256 files before installation.'
          if [ "$SIGNED" != true ]; then
            NOTES="$NOTES"$'\n\n''> [!WARNING]'$'\n''> The Android APK is signed with the Android debug key because no release keystore secrets were configured for this build.'
          fi
          gh release view "$TAG" >/dev/null 2>&1 && { echo "Release already exists"; exit 1; }
          gh release create "$TAG" artifacts/* --generate-notes --title "Toman Rates ${{ needs.version.outputs.version }}" --notes "$NOTES"
